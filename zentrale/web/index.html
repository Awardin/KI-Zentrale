<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modellzentrale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='3' height='10' rx='.6' fill='%234453C8'/%3E%3Crect x='5' y='3' width='3' height='10' rx='.6' fill='%234453C8'/%3E%3Crect x='9' y='3' width='3' height='10' rx='.6' fill='%230E8A86'/%3E%3Crect x='13' y='3' width='2' height='10' rx='.6' fill='%23C3CAD0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="kopf">
  <div class="kopf-titel">
    <h1>Modellzentrale</h1>
    <p class="kopf-stand" id="stand">Verbinde mit dem Dienst …</p>
  </div>
  <nav class="reiter" aria-label="Bereiche">
    <a href="#modelle" class="reiter-knopf" id="reiter-modelle" aria-current="page">Modelle</a>
    <a href="#chat" class="reiter-knopf" id="reiter-chat">Chat</a>
  </nav>
  <p class="kopf-aktion" id="aktion" hidden><span class="puls" aria-hidden="true"></span><span id="aktion-text"></span></p>
  <button class="knopf knopf-haupt" id="freigeben" type="button">GPU freigeben</button>
</header>
<main id="bereich-modelle">
  <section class="karten" id="karten" aria-label="Grafikkarten"></section>
  <div id="gruppen"></div>
  <section class="protokoll" aria-labelledby="protokoll-titel">
    <h2 id="protokoll-titel">Protokoll</h2>
    <ol id="protokoll"></ol>
  </section>
</main>
<section class="chat" id="bereich-chat" aria-label="Chat" hidden>
  <div class="chat-leiste">
    <p class="chat-stand" id="chat-stand">Prüfe die Chat-App …</p>
    <a class="knopf" id="chat-fenster" href="http://127.0.0.1:8791/" target="_blank" rel="noopener" hidden>In eigenem Fenster</a>
    <button class="knopf" id="chat-beenden" type="button" hidden>Chat-App beenden</button>
    <button class="knopf knopf-haupt" id="chat-starten" type="button" hidden>Chat-App starten</button>
  </div>
  <iframe class="chat-rahmen" id="chat-rahmen" title="Strata-Chat" hidden></iframe>
</section>
<dialog id="dialog" aria-labelledby="dialog-titel"></dialog>
<script src="/app.js"></script>
</body>
</html>
